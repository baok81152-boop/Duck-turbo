<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck Race</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(#70d6ff, #dff9ff);
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

#title {
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  padding: 15px;
  color: #fff;
  text-shadow: 2px 3px #555;
}

#track {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 18%;
  bottom: 20%;
  background: #69c96b;
  border: 8px solid #fff;
  border-radius: 20px;
  overflow: hidden;
}

.lane {
  position: relative;
  height: 50%;
  border-bottom: 5px dashed rgba(255,255,255,.8);
}

/* Vịt */
.duck {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 58px;
  filter: drop-shadow(3px 4px 2px rgba(0,0,0,.3));
  transition: left .15s linear;
}

/* hiệu ứng chạy */
.running {
  animation: bounce .25s infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(-50%) rotate(-3deg); }
  to { transform: translateY(-58%) rotate(3deg); }
}

/* Đích */
#finish {
  position: absolute;
  right: 0;
  top: 0;
  width: 12px;
  height: 100%;
  background: repeating-linear-gradient(
    45deg,
    #fff 0 12px,
    #222 12px 24px
  );
}

/* Nút */
.controls {
  position: absolute;
  bottom: 5%;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 20px;
}

button {
  width: 130px;
  height: 60px;
  border: none;
  border-radius: 20px;
  font-size: 25px;
  font-weight: bold;
  background: #ffd43b;
  box-shadow: 0 6px 0 #c49b00;
}

button:active {
  transform: translateY(5px);
  box-shadow: 0 1px 0 #c49b00;
}

/* Màn hình hiệu ứng */
#overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#message {
  color: white;
  font-size: 55px;
  font-weight: bold;
  text-align: center;
  text-shadow: 4px 4px #222;
  animation: pop .6s infinite alternate;
}

@keyframes pop {
  from { transform: scale(.9); }
  to { transform: scale(1.1); }
}

.confetti {
  position: absolute;
  width: 12px;
  height: 12px;
  animation: fall 2s linear forwards;
}

@keyframes fall {
  from {
    transform: translateY(-20px) rotate(0deg);
  }
  to {
    transform: translateY(100vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="title">🦆 ĐUA VỊT 🦆</div>

  <div id="track">
    <div class="lane">
      <div id="duck1" class="duck">🦆</div>
    </div>

    <div class="lane">
      <div id="duck2" class="duck">🦆</div>
    </div>

    <div id="finish"></div>
  </div>

  <div class="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
  </div>

  <div id="overlay">
    <div id="message">🏁 CHUẨN BỊ! 🏁</div>
  </div>

</div>

<script>
const duck1 = document.getElementById("duck1");
const duck2 = document.getElementById("duck2");
const overlay = document.getElementById("overlay");
const message = document.getElementById("message");

let pos1 = 15;
let pos2 = 15;
let started = false;
let finished = false;

function startGame() {
  message.innerHTML = "3";
  
  setTimeout(() => message.innerHTML = "2", 700);
  setTimeout(() => message.innerHTML = "1", 1400);

  setTimeout(() => {
    message.innerHTML = "🏁 BẮT ĐẦU! 🏁";
    started = true;

    duck1.classList.add("running");
    duck2.classList.add("running");

    setTimeout(() => {
      overlay.style.display = "none";
    }, 700);
  }, 2100);
}

function move(amount) {
  if (!started || finished) return;

  pos1 += amount;

  const max = document.getElementById("track").clientWidth - 75;

  if (pos1 > max) pos1 = max;
  if (pos1 < 15) pos1 = 15;

  duck1.style.left = pos1 + "px";

  // Vịt đối thủ tự chạy
  pos2 += Math.random() * 3;

  if (pos2 > max) pos2 = max;

  duck2.style.left = pos2 + "px";

  if (pos1 >= max) win();
  else if (pos2 >= max) lose();
}

function win() {
  finished = true;
  duck1.classList.remove("running");

  overlay.style.display = "flex";
  message.innerHTML = "🎉 CHÚC MỪNG! 🎉<br>🏆 MÀY THẮNG! 🏆";

  confetti();
}

function lose() {
  finished = true;

  overlay.style.display = "flex";
  message.innerHTML = "😵 VỊT ĐỐI THỦ THẮNG!<br>🔄 THỬ LẠI NHÉ!";
}

function confetti() {
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";

    c.style.left = Math.random() * 100 + "vw";
    c.style.top = "-20px";

    c.style.background =
      ["#ff3838","#ffd43b","#51cf66","#339af0","#cc5de8"]
      [Math.floor(Math.random() * 5)];

    c.style.animationDelay = Math.random() * 1 + "s";

    document.body.appendChild(c);

    setTimeout(() => c.remove(), 3000);
  }
}

document.getElementById("right").addEventListener("click", () => {
  move(20);
});

document.getElementById("left").addEventListener("click", () => {
  move(-20);
});

// Cho phép giữ nút trên điện thoại
document.getElementById("right").addEventListener("touchstart", e => {
  e.preventDefault();
  move(20);
});

startGame();
</script>

</body>
  </html>
